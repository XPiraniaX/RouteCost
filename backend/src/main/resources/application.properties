spring.application.name=RouteCost

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/routecost}
spring.datasource.username=${DB_USERNAME:routecost}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

routecost.jwt.secret-base64=${JWT_SECRET_BASE64}
routecost.jwt.expiration=PT15M
routecost.auth.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:P7D}
routecost.auth.refresh-cookie-name=${REFRESH_COOKIE_NAME:routecost_refresh}
routecost.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
routecost.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
routecost.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
routecost.admin.email=${INITIAL_ADMIN_EMAIL:}
routecost.admin.password=${INITIAL_ADMIN_PASSWORD:}
routecost.admin.first-name=${INITIAL_ADMIN_FIRST_NAME:}
routecost.admin.last-name=${INITIAL_ADMIN_LAST_NAME:}

spring.data.web.pageable.max-page-size=100

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:routecost}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated

routecost.reminders.upcoming-days=7
routecost.reminders.scan-delay-ms=60000
routecost.reminders.publish-delay-ms=5000
