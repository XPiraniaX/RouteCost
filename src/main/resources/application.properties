spring.application.name=RouteCost

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/routecost}
spring.datasource.username=${DB_USERNAME:routecost}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

routecost.jwt.secret-base64=${JWT_SECRET_BASE64}
routecost.jwt.expiration=PT15M
routecost.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.data.web.pageable.max-page-size=100

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:routecost}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated

routecost.reminders.upcoming-days=7
routecost.reminders.scan-delay-ms=60000
routecost.reminders.publish-delay-ms=5000
