services:
  postgres:
    image: postgres:17
    container_name: routecost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routecost
      POSTGRES_USER: routecost
      POSTGRES_PASSWORD: routecost_dev_password
    ports:
      - "5432:5432"
    volumes:
      - routecost_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routecost -d routecost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routecost_postgres_data:
